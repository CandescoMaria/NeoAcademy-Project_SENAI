<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/style.css">
    <link rel="shortcut icon" href="./src/assets/images/Logo-Icon.png" type="image/x-icon">
    <title>Neo Academy</title>
</head>

<body>

    <!-- HEADER START -->
    <header class="container-header"> 

        <div class="container-icon">
            <img src="./src/assets/images/IconNeoAcademy.png" alt="" height="32px" width="32px">
            <h2>Neo Academy</h2>
        </div>

        <div class="container-navegation">
            <nav><a href=""><span class="span-header">Home</span></a></nav>
            <nav><a href="">About Us</a></nav>
            <nav><a href="">Membership Plans</a></nav>
            <nav><a href="">FAQ</a></nav>
        </div>

        <div class="container-user">
            <nav><a href=""><span class="span-header">Log in</span></a></nav>
            <nav><a href=""><span class="span-register">Join Now</span></a></nav>

        </div>

    </header>
    <!-- HEADER END -->

    <!-- MAIN START -->

    <main class="container-main">

        <div class="main-information">

            <div class="section-pattern">
                <img src="./src/assets/images/GreenDot.png" alt="" height="9px" width="9px">
                <h4>Push Your Limits</h4>
            </div>

            <h1>Transform Your Body. Redefine Your Limits.</h1>

            <p>Unlock your full potential with expert guidance, cutting-edge equipment, and a community that pushes you to be your best.</p>

            <div class="main-bottom">
                <nav><a href=""><span class="span-register">Join Now</span></a></nav>
                <button onclick="nextImage()">Explore Our Gym →</button>
            </div>

            </div>

            <div class="main-carrosel">

                <div class="main-slides">
                    <input type="radio" name="slide" id="slide1" checked>
                    <input type="radio" name="slide" id="slide2">
                    <input type="radio" name="slide" id="slide3">
                    <input type="radio" name="slide" id="slide4">
                    <input type="radio" name="slide" id="slide5">


                    <div class="slide s1"><img src="./src/assets/images/RecepçaoNeoAcademy.png" alt=""></div>
                    <div class="slide"><img src="./src/assets/images/MuscalacaoNeoAcademy.png" alt=""></div>
                    <div class="slide"><img src="./src/assets/images/CardioNeoAcademy.png" alt=""></div>
                    <div class="slide"><img src="./src/assets/images/FitnessNeoAcademy.png" alt=""></div>
                    <div class="slide"><img src="./src/assets/images/SpaNeoAcademy.png" alt=""></div>
                </div>

                <div class="navegation-button">
                    <label class="bar" for="slide1"></label>
                    <label class="bar" for="slide2"></label>
                    <label class="bar" for="slide3"></label>
                    <label class="bar" for="slide4"></label>
                    <label class="bar" for="slide5"></label>
                </div>

            </div>
        
    </main>






</body>
</html>
